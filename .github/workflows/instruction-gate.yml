name: instruction-gate
# AGENTS.md law 15 "Lock the method": the PR must prove the owner's named method was used.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  instruction-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
      - name: Gate self-test
        run: python3 -m unittest discover -s .github/scripts -p 'test_instruction_gate.py' -v
      - name: Check PR body against the instruction gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/instruction_gate.py
